# 개인정보처리방침·이용약관을 GitHub Pages 로 공개한다.
#
# docs/ 폴더를 통째로 Pages 에 올리면 서명 절차 같은 내부 문서까지 공개되므로,
# 두 문서만 골라 사이트를 만든다. 문서를 고쳐 main 에 합치면 다시 배포된다.
#
# 주소 (src/config/legal.ts 와 같아야 한다)
#   https://four-cut.github.io/frontend/privacy/
#   https://four-cut.github.io/frontend/terms/
#
# 처음 한 번은 저장소 설정 → Pages → Source 를 "GitHub Actions" 로 켜야 한다.
name: Legal pages

on:
  push:
    branches: [main]
    paths:
      - docs/privacy-policy.md
      - docs/terms-of-service.md
      - .github/workflows/legal-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: legal-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site/privacy site/terms
          cat > site/_config.yml <<'EOF'
          title: 찍고갈래
          lang: ko
          markdown: kramdown
          kramdown:
            input: GFM
          EOF
          { printf -- '---\nlayout: default\ntitle: 개인정보처리방침\n---\n\n'; cat docs/privacy-policy.md; } > site/privacy/index.md
          { printf -- '---\nlayout: default\ntitle: 이용약관\n---\n\n'; cat docs/terms-of-service.md; } > site/terms/index.md
          printf -- '---\nlayout: default\ntitle: 찍고갈래\n---\n\n- [개인정보처리방침](privacy/)\n- [이용약관](terms/)\n' > site/index.md

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
